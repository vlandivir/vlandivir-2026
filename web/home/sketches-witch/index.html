<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Witch sketches — draft</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/shared/site-theme.css?v=20260816-1" />
<link rel="stylesheet" href="styles.css?v=20260822-1" />
</head>
<body>
<main class="page-shell witch-gallery">
  <header class="witch-gallery__intro">
    <p class="eyebrow">Draft</p>
    <h1>Скетчи ведьмы</h1>
    <p>Черно-белая линия и цветная заливка того же скетча. На сайт не подключено.</p>
  </header>

  <section class="witch-pair" aria-labelledby="subs-title">
    <h2 id="subs-title">Субтитры</h2>
    <figure>
      <img src="bw/sketch-subs.png" alt="Чёрно-белый скетч: ведьма лежит на животе перед телефоном с полосками субтитров" />
      <figcaption>ЧБ</figcaption>
    </figure>
    <figure>
      <img src="color/sketch-subs.png" alt="Цветной скетч: ведьма лежит на животе перед телефоном с полосками субтитров" />
      <figcaption>Цвет</figcaption>
    </figure>
  </section>

  <section class="witch-pair" aria-labelledby="gpx-title">
    <h2 id="gpx-title">GPX Track PNG</h2>
    <figure>
      <img src="bw/sketch-gpx.png" alt="Чёрно-белый скетч: ведьма едет на велосипеде по тропе" />
      <figcaption>ЧБ</figcaption>
    </figure>
    <figure>
      <img src="color/sketch-gpx.png" alt="Цветной скетч: ведьма едет на велосипеде по тропе" />
      <figcaption>Цвет</figcaption>
    </figure>
  </section>

  <section class="witch-pair" aria-labelledby="trip-title">
    <h2 id="trip-title">Фото поездки</h2>
    <figure>
      <img src="bw/sketch-trip.png" alt="Чёрно-белый скетч: ведьма снимает камерой, вокруг падают полароиды" />
      <figcaption>ЧБ</figcaption>
    </figure>
    <figure>
      <img src="color/sketch-trip.png" alt="Цветной скетч: ведьма снимает камерой, вокруг падают полароиды" />
      <figcaption>Цвет</figcaption>
    </figure>
  </section>

  <section class="witch-pair" aria-labelledby="map-title">
    <h2 id="map-title">Карта мест</h2>
    <figure>
      <img src="bw/sketch-map.png" alt="Чёрно-белый скетч: крошечная ведьма идёт по огромной разложенной карте" />
      <figcaption>ЧБ</figcaption>
    </figure>
    <figure>
      <img src="color/sketch-map.png" alt="Цветной скетч: крошечная ведьма идёт по огромной разложенной карте" />
      <figcaption>Цвет</figcaption>
    </figure>
  </section>

  <section class="witch-pair" aria-labelledby="files-title">
    <h2 id="files-title">Файлы</h2>
    <figure>
      <img src="bw/sketch-files.png" alt="Чёрно-белый скетч: ведьма карабкается по башне из папок" />
      <figcaption>ЧБ</figcaption>
    </figure>
    <figure>
      <img src="color/sketch-files.png" alt="Цветной скетч: ведьма карабкается по башне из папок" />
      <figcaption>Цвет</figcaption>
    </figure>
  </section>

  <section class="witch-pair" aria-labelledby="gtd-title">
    <h2 id="gtd-title">GTD</h2>
    <figure>
      <img src="bw/sketch-gtd.png" alt="Чёрно-белый скетч: ведьма за столом у стены из чекбоксов" />
      <figcaption>ЧБ</figcaption>
    </figure>
    <figure>
      <img src="color/sketch-gtd.png" alt="Цветной скетч: ведьма за столом у стены из чекбоксов" />
      <figcaption>Цвет</figcaption>
    </figure>
  </section>

  <section class="witch-pair" aria-labelledby="diary-title">
    <h2 id="diary-title">Дневник</h2>
    <figure>
      <img src="bw/sketch-diary.png" alt="Чёрно-белый скетч: ведьма сидит внутри клетки огромного календаря" />
      <figcaption>ЧБ</figcaption>
    </figure>
    <figure>
      <img src="color/sketch-diary.png" alt="Цветной скетч: ведьма сидит внутри клетки огромного календаря" />
      <figcaption>Цвет</figcaption>
    </figure>
  </section>

  <section class="witch-pair" aria-labelledby="email-title">
    <h2 id="email-title">Почта</h2>
    <figure>
      <img src="bw/sketch-email.png" alt="Чёрно-белый скетч: ведьма бежит за стаей конвертов" />
      <figcaption>ЧБ</figcaption>
    </figure>
    <figure>
      <img src="color/sketch-email.png" alt="Цветной скетч: ведьма бежит за стаей конвертов" />
      <figcaption>Цвет</figcaption>
    </figure>
  </section>

  <section class="witch-pair" aria-labelledby="reels-title">
    <h2 id="reels-title">Reels</h2>
    <figure>
      <img src="bw/sketch-reels.png" alt="Чёрно-белый скетч: ведьма сидит по-турецки и снимает себя на телефон на штативе" />
      <figcaption>ЧБ</figcaption>
    </figure>
    <figure>
      <img src="color/sketch-reels.png" alt="Цветной скетч: ведьма сидит по-турецки и снимает себя на телефон на штативе" />
      <figcaption>Цвет</figcaption>
    </figure>
  </section>
</main>
</body>
</html>
