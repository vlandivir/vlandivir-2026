<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" data-i18n-attr="content:metaDescription" content="Страницы Subs и GPX, где можно скачать все сохранённые файлы проекта." />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' https://fra1.digitaloceanspaces.com data: blob:; media-src 'self' https://fra1.digitaloceanspaces.com blob:; font-src 'self';" />
  <title data-i18n="title">Ваши файлы</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/shared/site-theme.css?v=20260801-3" />
  <link rel="stylesheet" href="/shared/site-header.css?v=20260718-1" />
  <link rel="stylesheet" href="/files/styles.css?v=20260816-1" />
  <script src="/files/i18n.js?v=20260816-2"></script>
  <script src="/shared/i18n.js?v=20260721-1"></script>
  <script src="/shared/site-header.js?v=20260801-1" defer></script>
</head>
<body>
  <header data-site-header data-active="files" data-lang-ru="/files/" data-lang-en="/files/en"></header>

  <main class="shell">
    <section class="page-head" aria-labelledby="page-title">
      <div>
        <h1 id="page-title" data-i18n="pageTitle">Ваши файлы</h1>
        <p data-i18n="pageLead">Страницы Subs и GPX. Без входа список хранится в этом браузере; после входа копируется на сервер и показывается оттуда.</p>
      </div>
      <button class="refresh-button" id="refreshButton" type="button" data-i18n="refresh">Обновить</button>
    </section>

    <section class="summary" aria-label="Сводка" data-i18n-attr="aria-label:summaryAria">
      <div>
        <span class="summary__value" id="totalCount">0</span>
        <span class="summary__label" data-i18n="labelFiles">страниц</span>
      </div>
      <div>
        <span class="summary__value" id="sourceCount">—</span>
        <span class="summary__label" data-i18n="labelSources">синхронизация</span>
      </div>
    </section>

    <label class="file-search">
      <span data-i18n="searchLabel">Поиск по страницам</span>
      <input id="searchInput" type="search" autocomplete="off" placeholder="Название или hash" data-i18n-attr="placeholder:searchPlaceholder" />
    </label>

    <section class="file-list" id="fileList" aria-live="polite"></section>
    <p class="empty" id="emptyState" hidden data-i18n="emptyState">Пока нет страниц. Загрузите видео на /subs или GPX на /gpx-route-png.</p>
  </main>

  <script src="/files/registry.js?v=20260816-2"></script>
  <script src="/shared/tool-pages.js?v=20260816-2"></script>
  <script src="/files/app.js?v=20260816-1"></script>
</body>
</html>
