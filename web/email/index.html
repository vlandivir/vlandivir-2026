<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Почта — конвейер</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/shared/site-theme.css?v=20260816-1" />
  <link rel="stylesheet" href="/shared/site-header.css?v=20260816-2" />
  <link rel="stylesheet" href="/shared/app-dialog.css?v=20260805-1" />
  <link rel="stylesheet" href="/email/styles.css?v=20260817-3" />
  <script src="/shared/app-dialog.js?v=20260805-1"></script>
  <script src="/shared/site-header.js?v=20260816-1" defer></script>
  <script src="/email/app.js?v=20260817-3" defer></script>
</head>
<body>
  <header data-site-header data-active="email" data-lang-none data-lang-ru="/email" data-lang-en="/email"></header>

  <main class="page-shell email-page">
    <section class="email-top">
      <div>
        <p class="eyebrow">Почтовый агент</p>
        <h1 class="page-title">Что происходит с почтой</h1>
      </div>
      <div class="email-actions">
        <button id="rules-toggle" class="ghost-btn">⚙️ Правила</button>
        <button id="log-toggle" class="ghost-btn">🧾 Журнал</button>
        <button id="sync-button" class="primary-btn">Синхронизировать</button>
      </div>
    </section>

    <section id="stats-row" class="editor-card stats-row" aria-label="Аккаунты"></section>

    <section id="rules-panel" class="editor-card rules-panel hidden" aria-label="Правила">
      <div class="rules-head">
        <h2 class="rules-title">Правила обработки</h2>
        <button id="rule-add" class="primary-btn">＋ Правило</button>
      </div>
      <form id="rule-form" class="rule-form hidden"></form>
      <div id="rules-list" class="rules-list"></div>
      <p id="rules-empty" class="muted hidden">Правил пока нет</p>
    </section>

    <section id="log-panel" class="editor-card log-panel hidden" aria-label="Журнал">
      <div class="rules-head">
        <h2 class="rules-title">Журнал действий</h2>
      </div>
      <div id="log-list" class="log-list"></div>
      <p id="log-empty" class="muted hidden">Действий пока не было</p>
    </section>

    <section class="editor-card list-card">
      <div class="list-filters">
        <input id="filter-query" type="search" placeholder="Поиск: тема, отправитель…" autocomplete="off" />
        <select id="filter-account" aria-label="Аккаунт"><option value="">Все аккаунты</option></select>
        <select id="filter-flag" aria-label="Фильтр">
          <option value="">Все письма</option>
          <option value="unseen">Непрочитанные</option>
          <option value="attachments">С вложениями</option>
          <option value="hidden">🙈 Скрытые</option>
          <option value="archived">📥 В архиве</option>
        </select>
      </div>
      <div id="important-section" class="list-section important-section hidden">
        <button id="important-toggle" type="button" class="list-section-head" aria-expanded="true">
          <span id="important-chevron" class="list-section-chevron">▾</span>
          <span>⭐ Важное</span>
          <span id="important-count" class="meta-chip">0</span>
        </button>
        <ul id="important-list" class="message-list section-list"></ul>
      </div>
      <ul id="message-list" class="message-list"></ul>
      <p id="list-empty" class="muted hidden">Ничего не найдено</p>
    </section>

    <div id="detail-holder" hidden>
      <article id="detail" class="message-preview hidden">
        <p id="detail-loading" class="muted hidden">Загрузка письма…</p>
        <div id="detail-content">
          <div class="detail-test-rules">
            <button id="test-rules-btn" class="mini-btn">🧪 Тестировать</button>
            <button id="apply-rules-btn" class="mini-btn">⚙️ Применить правила</button>
            <button id="to-gtd-btn" class="mini-btn">В GTD</button>
            <a id="detail-gmail" class="mini-btn hidden" href="#" target="_blank" rel="noopener noreferrer">↗ Gmail</a>
            <span id="test-rules-result" class="test-rules-result"></span>
          </div>
          <dl id="detail-meta" class="detail-meta"></dl>
          <div id="detail-labels" class="detail-labels"></div>
          <div id="detail-attachments" class="detail-attachments"></div>
          <div id="detail-body" class="detail-body"></div>
          <div id="detail-thread" class="detail-thread"></div>
        </div>
      </article>
    </div>
  </main>
</body>
</html>
