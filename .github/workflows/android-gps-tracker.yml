name: Android GPS Track APK

on:
  push:
    branches: [main]
    paths:
      - "mobile/gps-tracker-android/**"
      - ".github/workflows/android-gps-tracker.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            mobile/gps-tracker-android/**/*.gradle*
            mobile/gps-tracker-android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Missing ANDROID_KEYSTORE_BASE64 secret" >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/gps-tracker.p12"

      - name: Build signed release APK
        working-directory: mobile/gps-tracker-android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/gps-tracker.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          test -f app/build/outputs/apk/release/app-release.apk
          jarsigner -verify -certs app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/gps-tracker.apk"

      - name: Publish rolling GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Sideload APK for GPS Track. Built from \`${GITHUB_SHA:0:7}\` (run ${GITHUB_RUN_NUMBER}).

          Open the APK on the phone and allow installing unknown apps for the browser.

          If this is the first GitHub build, uninstall the USB/debug copy first — the signing key is different."
          if gh release view gps-tracker-android >/dev/null 2>&1; then
            gh release edit gps-tracker-android --title "GPS Track for Android" --notes "$notes" --target "$GITHUB_SHA"
          else
            gh release create gps-tracker-android --title "GPS Track for Android" --notes "$notes" --target "$GITHUB_SHA"
          fi
          gh release upload gps-tracker-android gps-tracker.apk --clobber
